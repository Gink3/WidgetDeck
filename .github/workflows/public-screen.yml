name: Public screening
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_public_screen.py
      - run: python tools/screen_public.py --require-fingerprints
        env:
          WIDGETDECK_RESTRICTED_SHA256: ${{ secrets.WIDGETDECK_RESTRICTED_SHA256 }}
