{% extends 'base.html' %}{% block title %}Create account · WidgetDeck{% endblock %}{% block body %}<main class="auth-page"><section class="auth-card"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>Create an account</h1><p class="muted">Each account has its own saved dashboard data.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}"><label>Username<input name="username" autocomplete="username" required autofocus pattern="[A-Za-z0-9_-]{3,40}"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="10" required></label><button class="primary" type="submit">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p></section></main>{% endblock %}
