{% extends 'base.html' %}{% block title %}Sign in · WidgetDeck{% endblock %}{% block body %}<main class="auth-page"><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Your tools and saved work stay private to your account.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}"><input type="hidden" name="next" value="{{ next or '' }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form><p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p></section></main>{% endblock %}
